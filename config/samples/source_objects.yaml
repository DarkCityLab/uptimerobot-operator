apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin
  annotations:
    # Opt in to UptimeRobot monitoring for this route's hostnames.
    monitoring.homelab.io/enabled: "true"
    # Optional overrides:
    # monitoring.homelab.io/path: "/healthz"
    # monitoring.homelab.io/interval: "300"
    # monitoring.homelab.io/alert-contacts: "8307662"
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - httpbin.example.com
  rules:
    - backendRefs:
        - name: httpbin
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    monitoring.homelab.io/enabled: "true"
spec:
  rules:
    - host: web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  tls:
    - hosts:
        - web.example.com
      secretName: web-tls
