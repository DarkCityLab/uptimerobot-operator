name: Trivy Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday ~04:27 (off the :00 mark)
  workflow_dispatch: {} # allow admins to run on demand

permissions:
  contents: read
  # Required to upload SARIF to GitHub code scanning. Code-scanning alerts are
  # visible only to users with write/admin/security access — not read-only or
  # public viewers — which satisfies the "admin only" requirement.
  security-events: write
  # Lets the CodeQL upload action read workflow-run metadata (telemetry/status).
  actions: read

# Cancel superseded runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scan the working tree: Go dependencies (vuln), Dockerfile + Helm/kustomize
  # manifests (misconfig/IaC), hardcoded secrets, and dependency licenses.
  repo:
    name: Repo scan (deps, Dockerfile/IaC, secrets, licenses)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0" # report-only: never fail the job on findings
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload filesystem SARIF to code scanning
        if: always()
        continue-on-error: true # needs a public repo or GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload filesystem SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          if-no-files-found: warn

      - name: Trivy filesystem scan (table, printed to the run log)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "0"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

  # Build the operator image and scan it for OS/package CVEs and secrets.
  image:
    name: Image scan (CVEs, secrets)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build operator image (single-arch, local)
        run: make docker-build IMG=uptimerobot-operator:scan

      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: uptimerobot-operator:scan
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"

      - name: Upload image SARIF to code scanning
        if: always()
        continue-on-error: true # needs a public repo or GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload image SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          if-no-files-found: warn

      - name: Trivy image scan (table, printed to the run log)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: uptimerobot-operator:scan
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: table
          exit-code: "0"
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
