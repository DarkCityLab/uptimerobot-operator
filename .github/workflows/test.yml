name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the repo (checkout + build + test).
permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
