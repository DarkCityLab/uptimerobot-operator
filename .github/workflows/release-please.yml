name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual regeneration of the release PR

permissions:
  contents: write
  pull-requests: write

# Only one release-please run at a time on main.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # Maintains a "release PR" that bumps the version in Chart.yaml and
      # README, updates CHANGELOG.md, and — when merged — creates the vX.Y.Z
      # tag + GitHub Release. The tag then triggers release.yml, which builds,
      # signs, and publishes the image and Helm chart.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Enable auto-merge on the release PR so it merges itself once the
      # required CODEOWNERS approval lands and checks pass. Requires
      # "Allow auto-merge" in repo settings; harmless no-op otherwise.
      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.pr }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash \
            "${{ fromJson(steps.release.outputs.pr).number }}" \
            -R "${{ github.repository }}"
