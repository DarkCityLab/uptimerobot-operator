name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Build golangci-lint from source (via make) so it is compiled with this
      # module's Go toolchain and includes the custom logcheck plugin defined in
      # .custom-gcl.yml. Using the prebuilt action binary fails here because it
      # is built with an older Go than the module targets and lacks the plugin.
      - name: Run linter
        run: make lint
