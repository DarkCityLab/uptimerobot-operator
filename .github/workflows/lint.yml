name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of this workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only reads the repo (checkout + build).
permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-24.04
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Build golangci-lint from source (via make) so it is compiled with this
      # module's Go toolchain and includes the custom logcheck plugin defined in
      # .custom-gcl.yml. Using the prebuilt action binary fails here because it
      # is built with an older Go than the module targets and lacks the plugin.
      - name: Run linter
        run: make lint
