## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## UptimeRobot API access.
##
## The operator reads the API token from a mounted Secret file. Create the
## Secret out-of-band and reference it by name here, e.g.:
##   kubectl create secret generic uptimerobot-api-key \
##     --from-literal=apiKey=YOUR_TOKEN -n <release-namespace>
##
uptimerobot:
  # Name of the pre-existing Secret holding the API token.
  apiKeySecretName: uptimerobot-api-key
  # Key within the Secret that holds the token.
  apiKeyKey: apiKey
  # Mount path for the token file (must match the --api-key-file arg below).
  mountPath: /etc/uptimerobot
  # Client-side request rate limit per minute (Free plan = 10).
  rateLimitPerMinute: 10
  # Comma-separated alert-contact IDs applied to monitors that set none of their
  # own. Leave empty for no default.
  defaultAlertContacts: ""
  # Credential-Secret rotation handling.
  secretWatch:
    # When true, the operator WATCHES Secrets labelled
    # monitoring.homelab.io/credential=true and pushes a rotated credential to
    # UptimeRobot within seconds. This grants the ClusterRole list;watch on
    # secrets (cluster-wide) — enable only if you need prompt rotation.
    # When false (default), the operator holds only `get` on secrets and picks
    # up a rotation on secretResyncInterval.
    enabled: false
  # How often a Monitor that references a credential Secret is re-reconciled so a
  # rotated Secret is re-read and re-pushed (used when secretWatch.enabled=false).
  secretResyncInterval: 60s

## Configure the controller manager deployment
##
manager:
  replicas: 1

  image:
    repository: ghcr.io/darkcitylab/uptimerobot-operator
    # tag defaults to the chart's appVersion when left empty.
    tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect
    - --api-key-file=/etc/uptimerobot/apiKey
    # Add operator tuning flags as needed, for example:
    # - --requests-per-minute=10
    # - --default-alert-contacts=8307662
    # - --status-refresh-interval=5m

  ## Environment variables
  ##
  env: []

  ## Image pull secrets
  ##
  imagePullSecrets: []

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
        type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    allowPrivilegeEscalation: false
    capabilities:
        drop:
            - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
        cpu: 500m
        memory: 128Mi
    requests:
        cpu: 10m
        memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

## Helper RBAC roles for managing custom resources
##
rbacHelpers:
  # Install convenience admin/editor/viewer roles for CRDs
  enable: false

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enable: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint with RBAC protection.
##
metrics:
  enable: true
  # Metrics server port
  port: 8443

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enable: false

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enable: false


## Helm test suite (run with `helm test <release> -n <namespace>`).
## Adds hook pods that verify the operator is installed and serving:
## connectivity to the metrics endpoint, the CRD is Established, the controller
## Deployment is Available, and the CRD's validation accepts a valid Monitor
## while rejecting an invalid one.
##
tests:
  enable: true
  # Opt-in END-TO-END test: creates a real Monitor, waits for Ready (the operator
  # creates it in UptimeRobot), then deletes it. Makes real UptimeRobot API calls
  # and needs a valid API key + egress, so it is OFF by default.
  functional: true
  # Image for the operator/CRD checks (needs a shell + kubectl). Override if you
  # mirror images or pin a different version.
  kubectlImage: alpine/kubectl:1.34.1
  # Image for the metrics connectivity check (needs curl + a shell).
  connectionImage: curlimages/curl:8.11.1
