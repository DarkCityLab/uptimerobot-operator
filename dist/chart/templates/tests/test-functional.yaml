{{- if and (.Values.tests | default dict).enable (.Values.tests | default dict).functional }}
# Opt-in END-TO-END Helm test (tests.functional=true): creates a real Monitor,
# waits for the operator to create it in UptimeRobot (Ready + a monitorID), then
# deletes it (the finalizer removes the UptimeRobot monitor). Makes REAL API
# calls — requires a valid API key and egress to api.uptimerobot.com.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test-functional" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "uptimerobot-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: manifests
      configMap:
        name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test-manifests" "context" $) }}
    - name: tmp
      emptyDir: {}
  containers:
    - name: functional-test
      image: {{ (.Values.tests | default dict).kubectlImage | default "alpine/kubectl:1.34.1" }}
      env:
        - name: HOME
          value: /tmp
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          ns="{{ .Release.Namespace }}"
          name="helm-functional-test"
          echo "== cleanup any leftover =="
          kubectl -n "$ns" delete monitor "$name" --ignore-not-found --wait=true --timeout=60s
          echo "== create Monitor =="
          kubectl -n "$ns" apply -f /manifests/functional.yaml
          echo "== wait for the operator to reconcile it to Ready =="
          kubectl -n "$ns" wait --for=condition=Ready "monitor/$name" --timeout=120s
          id=$(kubectl -n "$ns" get monitor "$name" -o jsonpath='{.status.monitorID}')
          echo "created UptimeRobot monitor id=${id}"
          if [ -z "${id}" ]; then echo "FAIL: no monitorID in status"; exit 1; fi
          echo "== delete Monitor (finalizer removes the UptimeRobot monitor) =="
          kubectl -n "$ns" delete monitor "$name" --wait=true --timeout=90s
          echo "FUNCTIONAL TEST PASSED"
      volumeMounts:
        - name: manifests
          mountPath: /manifests
          readOnly: true
        - name: tmp
          mountPath: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
{{- end }}
