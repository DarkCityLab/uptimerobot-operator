{{- if (.Values.tests | default dict).enable }}
# Ephemeral RBAC for the operator Helm test (deleted after the test run).
# Grants exactly what the test pod needs: read the CRD, read the controller
# Deployment, and server-dry-run a Monitor to exercise CRD validation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.homelab.io"]
    resources: ["monitors"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
