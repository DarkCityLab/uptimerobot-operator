{{- if (.Values.tests | default dict).enable }}
# Helm test: operator functional checks — the CRD is Established, the controller
# Deployment is Available, and the CRD's validation accepts a valid Monitor and
# rejects an invalid one (server dry-run, no real UptimeRobot call). Runs after
# the test RBAC/ConfigMap (hook-weight ordering).
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test-operator" "context" $) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "uptimerobot-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test" "context" $) }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  volumes:
    - name: manifests
      configMap:
        name: {{ include "uptimerobot-operator.resourceName" (dict "suffix" "test-manifests" "context" $) }}
    - name: tmp
      emptyDir: {}
  containers:
    - name: operator-test
      image: {{ (.Values.tests | default dict).kubectlImage | default "alpine/kubectl:1.34.1" }}
      env:
        - name: HOME
          value: /tmp
      command: ["sh", "-c"]
      args:
        - |
          set -eu
          ns="{{ .Release.Namespace }}"
          dep="{{ include "uptimerobot-operator.resourceName" (dict "suffix" "controller-manager" "context" $) }}"
          echo "== 1/4 CRD is Established =="
          kubectl wait --for=condition=Established --timeout=90s crd/monitors.monitoring.homelab.io
          echo "== 2/4 controller Deployment is Available =="
          kubectl -n "$ns" wait --for=condition=Available --timeout=150s "deploy/$dep"
          echo "== 3/4 valid Monitor accepted (server dry-run) =="
          kubectl -n "$ns" apply --dry-run=server -f /manifests/valid.yaml
          echo "== 4/4 invalid Monitor rejected (server dry-run) =="
          if kubectl -n "$ns" apply --dry-run=server -f /manifests/invalid.yaml 2>/dev/null; then
            echo "FAIL: invalid KEYWORD Monitor (no keyword block) was accepted"
            exit 1
          fi
          echo "OK: invalid Monitor rejected by CRD validation"
          echo "ALL OPERATOR TESTS PASSED"
      volumeMounts:
        - name: manifests
          mountPath: /manifests
          readOnly: true
        - name: tmp
          mountPath: /tmp
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
{{- end }}
